<div class="radar">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="sweep"></div>
  <div class="hub"></div>

  @for (a of plotted(); track a.id) {
    <div
      class="node"
      [class.ground]="a.onGround"
      [style.left.%]="a.xPct"
      [style.top.%]="a.yPct"
      [title]="a.callsign + (a.altitudeFt ? ' — ' + (a.altitudeFt | number) + ' ft' : '')"
    ></div>
  }

  <div class="radar-label">{{ count() }} AIRCRAFT — {{ statusLabel() }}</div>
</div>
