<div class="auth-page">
  <div class="auth-card">
    <div class="eyebrow-line"></div>
    <h1>Welcome back.</h1>
    <p class="lede">Sign in to manage your bookings and flights.</p>

    @if (step() === 'credentials') {
      <form [formGroup]="credentialsForm" (ngSubmit)="submitCredentials()">
        <label class="field">
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        </label>

        @if (errorMessage()) {
          <div class="error">{{ errorMessage() }}</div>
        }

        <button type="submit" class="submit-btn" [disabled]="credentialsForm.invalid || loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
    } @else {
      <form [formGroup]="mfaForm" (ngSubmit)="submitMfaCode()">
        <p class="mfa-hint">Enter the 6-digit code from your authenticator app.</p>

        <label class="field">
          <span>Authentication code</span>
          <input
            type="text"
            inputmode="numeric"
            maxlength="6"
            formControlName="code"
            autocomplete="one-time-code"
            placeholder="000000"
          />
        </label>

        @if (errorMessage()) {
          <div class="error">{{ errorMessage() }}</div>
        }

        <button type="submit" class="submit-btn" [disabled]="mfaForm.invalid || loading()">
          {{ loading() ? 'Verifying…' : 'Verify and sign in' }}
        </button>
        <button type="button" class="back-btn" (click)="backToCredentials()">Back</button>
      </form>
    }
  </div>
</div>
